<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blackjack — Table de Jeu</title>
<meta name="description" content="Jouez au blackjack avec des jetons virtuels, sans argent réel." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <span class="brand-mark">♠</span>
    <span class="brand-name">Table de Jeu</span>
  </a>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="blackjack.html" aria-current="page">Blackjack</a>
    <a href="poker.html">Poker</a>
  </nav>
</header>

<main>
  <div class="table-jeu">

    <div class="bandeau-solde">
      <span>Solde : <span class="solde" id="solde">1000</span> jetons</span>

      <div class="zone-mise">
        <label for="mise">Mise</label>
        <input type="number" id="mise" min="10" step="10" value="50" />
        <div class="jetons-rapides" aria-label="Ajouter des jetons à la mise">
          <button type="button" class="jeton" data-valeur="10">+10</button>
          <button type="button" class="jeton" data-valeur="50">+50</button>
          <button type="button" class="jeton" data-valeur="100">+100</button>
        </div>
      </div>
    </div>

    <div class="plateau">

      <div class="zone-main">
        <div class="etiquette-main">
          <span>Croupier</span>
          <span class="score" id="score-croupier">—</span>
        </div>
        <div class="cartes" id="cartes-croupier"></div>
      </div>

      <p class="message-table" id="message" role="status" aria-live="polite">Placez votre mise et distribuez.</p>

      <div class="zone-main">
        <div class="etiquette-main">
          <span>Vous</span>
          <span class="score" id="score-joueur">—</span>
        </div>
        <div class="cartes" id="cartes-joueur"></div>
      </div>

    </div>

    <div class="commandes">
      <button type="button" class="bouton principal" id="btn-distribuer">Distribuer</button>
      <button type="button" class="bouton" id="btn-tirer" disabled>Tirer une carte</button>
      <button type="button" class="bouton" id="btn-rester" disabled>Rester</button>
      <button type="button" class="bouton" id="btn-doubler" disabled>Doubler</button>
    </div>

  </div>
</main>

<p class="pied">Site créé à des fins de divertissement uniquement — aucune mise réelle, aucun gain réel.</p>

<script src="js/blackjack.js"></script>
</body>
</html>
